<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standpunkt 2030 - Play</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        [v-cloak] { display: none; }
        body { background-color: #111827; color: white; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    {% raw %}
    <div id="app" v-cloak class="min-h-screen flex flex-col p-4 max-w-md mx-auto">
        
        <!-- HEADER -->
        <div class="flex justify-between items-center mb-6 pt-2">
            <div class="text-sm font-bold text-gray-500 uppercase tracking-widest">Standpunkt 2030</div>
            <div class="w-2 h-2 rounded-full" :class="connected ? 'bg-green-500' : 'bg-red-500'"></div>
        </div>

        <!-- CONTENT -->
        <div v-if="state.phase === 'voting' && state.scenario_data" class="flex-1 flex flex-col space-y-6">
            
            <!-- Scenario Info -->
            <div>
                <h1 class="text-2xl font-bold leading-tight mb-2">{{ state.scenario_data.title }}</h1>
                <div class="bg-gray-800 rounded-lg p-3 text-sm text-gray-300 border-l-4 border-blue-500">
                    Lies die Dossiers, bevor du abstimmst!
                </div>
            </div>

            <!-- Dossiers (Accordion) -->
            <div class="space-y-2">
                <div v-for="dossier in state.scenario_data.dossiers" :key="dossier.id" 
                     class="bg-gray-800 rounded-lg overflow-hidden border border-gray-700">
                    
                    <button @click="toggleDossier(dossier.id)" 
                            class="w-full px-4 py-3 flex justify-between items-center font-bold text-left hover:bg-gray-700 transition">
                        <span>{{ dossier.title }}</span>
                        <span class="text-xl">{{ openDossier === dossier.id ? '-' : '+' }}</span>
                    </button>
                    
                    <div v-if="openDossier === dossier.id" class="p-4 bg-gray-900 text-gray-300 text-sm leading-relaxed border-t border-gray-700">
                        <p v-for="(block, idx) in dossier.content" :key="idx" class="mb-2">
                            {{ block.value }}
                        </p>
                    </div>
                </div>
            </div>

            <!-- Voting Buttons -->
            <div class="mt-auto pb-6 space-y-3">
                <div class="text-xs text-center text-gray-500 uppercase mb-2">Deine Stimme zählt</div>
                
                <button v-for="opt in state.scenario_data.vote_options" :key="opt.id"
                        @click="vote(opt.id)"
                        :disabled="hasVoted"
                        class="w-full p-4 rounded-xl text-left transition-all transform active:scale-95 border-2 relative overflow-hidden"
                        :class="myVote === opt.id ? 'bg-blue-600 border-blue-400' : 'bg-gray-800 border-gray-700 hover:border-gray-500'">
                    
                    <div class="font-bold text-lg mb-1">{{ opt.label }}</div>
                    <div class="text-xs text-gray-400" :class="myVote === opt.id ? 'text-blue-200' : ''">
                        {{ opt.description }}
                    </div>
                    
                    <!-- Checkmark if voted -->
                    <div v-if="myVote === opt.id" class="absolute top-2 right-2 text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                </button>
            </div>
        </div>

        <!-- WAITING STATE -->
        <div v-else class="flex-1 flex flex-col items-center justify-center text-center space-y-4">
            <div class="animate-pulse bg-gray-800 p-6 rounded-full">
                <svg class="w-12 h-12 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <div>
                <h2 class="text-xl font-bold">Bitte warten...</h2>
                <p class="text-gray-400 text-sm mt-2">
                    <span v-if="state.phase === 'result'">Das Ergebnis wird am Board diskutiert.</span>
                    <span v-else>Das Spiel beginnt gleich.</span>
                </p>
            </div>
        </div>

    </div>
    {% endraw %}

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    ws: null,
                    connected: false,
                    openDossier: null,
                    myVote: null, // Tracks local vote for UI feedback
                    state: {
                        phase: 'loading',
                        scenario_data: {}
                    }
                }
            },
            computed: {
                hasVoted() {
                    return this.myVote !== null;
                }
            },
            methods: {
                connect() {
                    const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
                    this.ws = new WebSocket(`${protocol}://${window.location.host}/ws/player`);
                    this.ws.onopen = () => { this.connected = true; };
                    this.ws.onclose = () => { this.connected = false; setTimeout(this.connect, 1000); };
                    this.ws.onmessage = (event) => {
                        const newState = JSON.parse(event.data);
                        // If scenario ID changes, reset local vote
                        if (newState.current_scenario_id !== this.state.current_scenario_id) {
                            this.myVote = null;
                            this.openDossier = null;
                        }
                        this.state = newState;
                    };
                },
                toggleDossier(id) {
                    this.openDossier = this.openDossier === id ? null : id;
                },
                vote(optionId) {
                    if (this.hasVoted) return;
                    this.myVote = optionId;
                    this.ws.send(JSON.stringify({ type: 'vote', value: optionId }));
                }
            },
            mounted() {
                this.connect();
            }
        }).mount('#app');
    </script>
</body>
</html>
