<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standpunkt 2030</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; color: white; }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen space-y-8">
    
    <div class="text-center">
        <h1 class="text-5xl font-bold tracking-tighter mb-2">STANDPUNKT 2030</h1>
        <p class="text-gray-400">Interaktives Demokratie-Planspiel</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl px-4">
        <!-- Schüler -->
        <a href="/play" class="group relative block p-8 bg-blue-600 rounded-2xl hover:bg-blue-500 transition-all transform hover:-translate-y-1 shadow-2xl">
            <div class="absolute inset-0 bg-white opacity-0 group-hover:opacity-10 rounded-2xl transition-opacity"></div>
            <h2 class="text-3xl font-bold mb-2">Mitspielen</h2>
            <p class="text-blue-100">Für Schüler & Teilnehmer</p>
            <div class="mt-4 text-sm font-mono bg-blue-800 bg-opacity-30 inline-block px-2 py-1 rounded">Mobilansicht</div>
        </a>

        <!-- Lehrer -->
        <a href="/board" class="group relative block p-8 bg-gray-800 border-2 border-gray-700 rounded-2xl hover:border-white transition-all transform hover:-translate-y-1 shadow-2xl">
            <h2 class="text-3xl font-bold mb-2">Präsentation</h2>
            <p class="text-gray-400">Für Lehrer & Moderatoren</p>
            <div class="mt-4 text-sm font-mono bg-gray-700 inline-block px-2 py-1 rounded">Beameransicht</div>
        </a>
    </div>

    <div class="absolute bottom-4 text-gray-600 text-xs">v2.0 Refined</div>
</body>
</html>
