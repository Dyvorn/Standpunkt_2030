<!DOCTYPE html>
<html>
<head>
    <title>Quiz Join</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: radial-gradient(circle at top left, #1e293b, #0f172a); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { font-size: 2.5rem; margin-bottom: 2rem; letter-spacing: -1px; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        input { padding: 18px; font-size: 1.2rem; border-radius: 12px; border: 2px solid #334155; width: 85%; max-width: 320px; margin-bottom: 20px; background: #1e293b; color: white; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #6366f1; }
        button { padding: 18px 30px; font-size: 1.2rem; background: #6366f1; color: white; border: none; border-radius: 12px; cursor: pointer; width: 85%; max-width: 320px; font-weight: bold; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <h1>Standpunkt 2030</h1>
    <input type="text" id="name" placeholder="Dein Name" maxlength="15">
    <button onclick="join()">Beitreten</button>

    <script>
        const socket = io();
        function join() {
            const name = document.getElementById('name').value;
            if(name.trim()) {
                socket.emit('join_game', {name: name});
                localStorage.setItem('quiz_name', name);
                window.location.href = '/lobby';
            }
        }
        socket.on('game_start', () => { window.location.href = '/game'; });
    </script>
</body>
</html>
