<!DOCTYPE html>
<html>
<head>
    <title>Quiz Lobby</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; text-align: center; padding-top: 50px; }
        .loader { border: 8px solid #f3f3f3; border-top: 8px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1 id="welcome">Warten auf Start...</h1>
    <div class="loader"></div>
    <p id="player-count">Du bist dabei!</p>

    <script>
        const socket = io();
        const name = localStorage.getItem('quiz_name');
        document.getElementById('welcome').innerText = `Bereit, ${name}!`;

        socket.on('player_joined', (data) => {
            document.getElementById('player-count').innerText = `${data.count} Spieler sind im Raum`;
        });

        socket.on('game_start', () => {
            window.location.href = '/game';
        });
    </script>
</body>
</html>
