
<!DOCTYPE html>
<html>
<head>
    <title>Standpunkt 2030</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; height: 100vh; overflow: hidden; }

        /* BEAMER MODE */
        .beamer { max-width: 1920px; margin: auto; }
        .header { background: rgba(0,0,0,0.8); padding: 2rem; text-align: center; }
        .header h1 { font-size: 4rem; margin-bottom: 1rem; }
        .szene-text { font-size: 2rem; padding: 2rem; background: rgba(255,255,255,0.1); margin: 2rem; border-radius: 20px; }

        .vote-balken { display: flex; justify-content: space-around; padding: 3rem; }
        .balken { flex: 1; height: 100px; background: linear-gradient(to right, red, orange, yellow); margin: 0 1rem; border-radius: 50px; position: relative; transition: width 0.5s; }
        .balken-a { background: linear-gradient(to right, #ff4757, #ff6b7a); }
        .balken-b { background: linear-gradient(to right, #2ed573, #51cf66); }
        .balken-c { background: linear-gradient(to right, #3742fa, #5f27cd); }
        .balken-label { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); font-weight: bold; }

        .werte { display: flex; justify-content: space-around; padding: 2rem; background: rgba(0,0,0,0.5); margin: 2rem; border-radius: 20px; }
        .wert { text-align: center; }
        .wert-bar { width: 200px; height: 30px; background: rgba(255,255,255,0.2); margin-top: 0.5rem; border-radius: 15px; overflow: hidden; }
        .wert-fill { height: 100%; transition: width 1s; border-radius: 15px; }

        /* HANDY MODE */
        @media (max-width: 768px) {
            .handy { padding: 1rem; }
            .header h1 { font-size: 2rem; }
            .szene-text { font-size: 1.2rem; padding: 1rem; margin: 1rem 0; }
            .option-btn { display: block; width: 100%; padding: 1.5rem; margin: 1rem 0; font-size: 1.2rem; border: none; border-radius: 15px; cursor: pointer; }
            .btn-a { background: linear-gradient(45deg, #ff4757, #ff6b7a); color: white; }
            .btn-b { background: linear-gradient(45deg, #2ed573, #51cf66); color: white; }
            .dossier { background: rgba(255,255,255,0.1); margin: 1rem 0; padding: 1rem; border-radius: 10px; cursor: pointer; }
            .dossier.open { background: rgba(255,255,255,0.2); }
        }

        .news { padding: 2rem; background: rgba(0,0,0,0.7); margin: 2rem; border-radius: 20px; text-align: center; font-size: 1.5rem; }
        .admin { position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 1rem; border-radius: 10px; }
        .qr { width: 200px; height: 200px; margin: 2rem auto; background: #ddd; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    </style>
</head>
<body>
    <div class="beamer">
        <div class="admin">
            <input id="room" placeholder="Room ID" style="padding:0.5rem;">
            <button onclick="joinRoom()">Join</button>
            <button onclick="nextScene()">Next Szene</button>
            <span id="status"></span>
        </div>

        <div class="header">
            <h1 id="titel">Standpunkt 2030</h1>
            <div class="qr" id="qr">QR</div>
        </div>

        <div class="szene-text" id="text">Lobby - Thema wählen</div>

        <div class="vote-balken" id="votes" style="display:none;">
            <div class="balken balken-a" id="balkenA" style="width:0%"><span class="balken-label">A: 0%</span></div>
            <div class="balken balken-b" id="balkenB" style="width:0%"><span class="balken-label">B: 0%</span></div>
        </div>

        <div class="werte" id="werte" style="display:none;">
            <div class="wert"><div>Sicherheit</div><div class="wert-bar"><div class="wert-fill" style="width:50%;background:#2ed573;"></div></div></div>
            <div class="wert"><div>Freiheit</div><div class="wert-bar"><div class="wert-fill" style="width:65%;background:#ffa502;"></div></div></div>
            <div class="wert"><div>Budget</div><div class="wert-bar"><div class="wert-fill" style="width:60%;background:#ff4757;"></div></div></div>
        </div>

        <div class="news" id="news"></div>
    </div>

    <script>
        let ws, roomId, isHandy = window.innerWidth < 768;
        let currentState = {};

        async function joinRoom() {
            roomId = document.getElementById('room').value || 'demo';
            ws = new WebSocket(`ws://${window.location.host}/ws/${roomId}`);

            ws.onmessage = (e) => {
                currentState = JSON.parse(e.data);
                updateUI(currentState);
            };

            // Start demo game
            await fetch(`/room/${roomId}/start/wehrpflicht`);
            document.getElementById('status').innerText = `Room: ${roomId}`;
        }

        function updateUI(state) {
            const scene = state.scene;
            document.getElementById('titel').innerText = scene.titel;
            document.getElementById('text').innerHTML = scene.text.replace(/\n/g, '<br>');

            // Dossiers (Handy)
            if (isHandy && scene.dossiers) {
                let dossiersHTML = '';
                scene.dossiers.forEach(d => {
                    dossiersHTML += `<div class="dossier" onclick="toggleDossier(this)">${d.titel}<div style="display:none;">${d.text}</div></div>`;
                });
                document.getElementById('text').innerHTML += `<div>${dossiersHTML}</div>`;
            }

            // Votes
            if (state.votes) {
                const total = state.total_votes;
                Object.keys(state.votes).forEach(id => {
                    const pct = Math.round((state.votes[id] / total) * 100);
                    document.getElementById(`balken${id}`).style.width = pct + '%';
                    document.querySelector(`#balken${id} .balken-label`).innerText = `${id}: ${pct}%`;
                });
                document.getElementById('votes').style.display = 'flex';
            }

            // Werte
            Object.keys(state.werte).forEach(w => {
                const fill = document.querySelector(`[data-wert="${w}"]`) || 
                    document.querySelector('.wert-fill'); // Fallback
                if (fill) fill.style.width = state.werte[w] + '%';
            });
            document.getElementById('werte').style.display = 'flex';

            // Buttons (Handy)
            if (isHandy && scene.optionen) {
                let btns = '';
                scene.optionen.forEach(opt => {
                    btns += `<button class="option-btn btn-${opt.id.toLowerCase()}" onclick="vote('${opt.id}')">${opt.text}</button>`;
                });
                document.body.innerHTML += btns;
            }
        }

        async function vote(option) {
            await fetch(`/room/${roomId}/vote/${option}`);
        }

        async function nextScene() {
            const option = prompt('Welche Option? (A/B/A1 etc.)');
            if (option) {
                await fetch(`/room/${roomId}/next/${option}`);
            }
        }

        function toggleDossier(el) {
            const content = el.querySelector('div');
            content.style.display = content.style.display === 'none' ? 'block' : 'none';
            el.classList.toggle('open');
        }

        // Auto-start demo
        window.onload = joinRoom;
    </script>
</body>
</html>
